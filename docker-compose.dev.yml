# Entwicklung: nur die MongoDB, erreichbar unter localhost:27017.
# Backend und Frontend laufen direkt auf dem Rechner (siehe README).
#
#   docker compose -f docker-compose.dev.yml up -d
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data:
