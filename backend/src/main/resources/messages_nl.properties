backup.readme=AIDocuments – back-up van {0,date,long}, {0,time,short}\n\nInhoud: de database (aidocuments.db), de documenten inclusief eerdere versies (files/), de voorbeeldafbeeldingen (thumbnails/) en de sleutel voor opgeslagen wachtwoorden en tweestapsverificatie (secret.key). Bewaar dit bestand net zo veilig als de documenten zelf.\n\nHerstellen:\n1. Stop AIDocuments.\n2. Pak de inhoud van deze ZIP uit in een lege gegevensmap (of vervang de bestaande map ermee).\n3. Start AIDocuments. De zoekindex wordt daarbij opnieuw opgebouwd.\n
