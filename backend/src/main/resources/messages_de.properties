backup.readme=AIDocuments – Sicherung vom {0,date,long}, {0,time,short}\n\nInhalt: die Datenbank (aidocuments.db), die Dokumente samt früheren Fassungen (files/), die Vorschaubilder (thumbnails/) und der Schlüssel für gespeicherte Kennwörter und die Zwei-Faktor-Anmeldung (secret.key). Bewahre diese Datei so sicher auf wie die Dokumente selbst.\n\nWiederherstellen:\n1. AIDocuments beenden.\n2. Den Inhalt dieses ZIPs in ein leeres Datenverzeichnis entpacken (bzw. das bisherige damit ersetzen).\n3. AIDocuments starten. Der Suchindex wird dabei neu aufgebaut.\n
