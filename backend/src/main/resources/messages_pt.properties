backup.readme=AIDocuments – cópia de segurança de {0,date,long}, {0,time,short}\n\nConteúdo: a base de dados (aidocuments.db), os documentos com as versões anteriores (files/), as miniaturas (thumbnails/) e a chave das palavras-passe guardadas e da autenticação de dois fatores (secret.key). Guarde este ficheiro com o mesmo cuidado que os próprios documentos.\n\nPara restaurar:\n1. Pare o AIDocuments.\n2. Extraia o conteúdo deste ZIP para um diretório de dados vazio (ou substitua com ele o diretório existente).\n3. Inicie o AIDocuments. O índice de pesquisa é reconstruído no arranque.\n
