# AIDocuments – Portuguese (Portugal). Rules for translators: see messages.properties.

# --- Geral --------------------------------------------------------------------------------------------------
error.unexpected=Erro inesperado: {0}
error.validation.invalid=Entrada inválida.
error.internal=Erro interno. Os detalhes estão no registo do servidor.
error.upload.tooLarge=O ficheiro é demasiado grande (máximo de 50 MB por PDF).
error.secret.decryptFailed=Não é possível decifrar uma palavra-passe guardada (o secret.key foi alterado?)
error.secret.encryptFailed=Falha na cifragem

# --- Validação de entradas; apresentada como “nome do campo: texto” -----------------------------------------
validation.notBlank=não pode estar vazio
validation.notNull=não pode ser nulo
validation.size=o tamanho tem de estar entre {min} e {max}
validation.min=tem de ser maior ou igual a {value}
validation.max=tem de ser menor ou igual a {value}
validation.username=3 a 50 caracteres; são permitidos letras, algarismos, ponto, hífen, sublinhado e @
validation.password=pelo menos 8 caracteres
validation.interval.min=pelo menos 1 minuto
validation.interval.max=no máximo 1440 minutos (24 horas)
validation.baseUrl=tem de começar por http:// ou https://

