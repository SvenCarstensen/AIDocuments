# --- Validación de entradas; se muestra como «nombre del campo: texto» --------------------------------------
validation.notBlank=no debe estar vacío
validation.notNull=no debe ser nulo
validation.size=el tamaño debe estar entre {min} y {max}
validation.min=debe ser mayor o igual que {value}
validation.max=debe ser menor o igual que {value}
validation.username=de 3 a 50 caracteres; se permiten letras, dígitos, punto, guion, guion bajo y @
validation.password=al menos 8 caracteres
validation.interval.min=al menos 1 minuto
validation.interval.max=como máximo 1440 minutos (24 horas)
validation.baseUrl=debe empezar por http:// o https://

