backup.readme=AIDocuments – sikkerhetskopi fra {0,date,long}, {0,time,short}\n\nInnhold: databasen (aidocuments.db), dokumentene inkludert tidligere versjoner (files/), miniatyrbildene (thumbnails/) og nøkkelen til lagrede passord og tofaktorautentiseringen (secret.key). Oppbevar denne filen like sikkert som selve dokumentene.\n\nGjenoppretting:\n1. Stopp AIDocuments.\n2. Pakk ut innholdet i denne ZIP-filen i en tom datamappe (eller erstatt den eksisterende med det).\n3. Start AIDocuments. Søkeindeksen bygges opp på nytt ved oppstart.\n
