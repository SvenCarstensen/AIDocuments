backup.readme=AIDocuments – резервна копија од {0,date,long}, {0,time,short}\n\nСадржај: база података (aidocuments.db), документи заједно са ранијим верзијама (files/), сличице (thumbnails/) и кључ за сачуване лозинке и двофакторску аутентификацију (secret.key). Чувајте ову датотеку подједнако безбедно као и саме документе.\n\nВраћање:\n1. Зауставите AIDocuments.\n2. Распакујте садржај овог ZIP-а у празан директоријум са подацима (или њиме замените постојећи).\n3. Покрените AIDocuments. Индекс претраге се притом поново гради.\n
