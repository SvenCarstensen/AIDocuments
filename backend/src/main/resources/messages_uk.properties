backup.readme=AIDocuments – резервна копія від {0,date,long}, {0,time,short}\n\nВміст: база даних (aidocuments.db), документи разом із попередніми версіями (files/), мініатюри (thumbnails/) і ключ до збережених паролів і двофакторної автентифікації (secret.key). Зберігайте цей файл так само надійно, як самі документи.\n\nВідновлення:\n1. Зупиніть AIDocuments.\n2. Розпакуйте вміст цього ZIP-архіву в порожній каталог даних (або замініть ним наявний).\n3. Запустіть AIDocuments. Під час цього пошуковий індекс буде створено заново.\n
