# AIDocuments – texts the server produces for end users. English; also the fallback for every other language.
#
# Translating: copy this file to messages_xx.properties (xx = language code, e.g. messages_fr.properties),
# keep it UTF-8 and translate the text to the right of "=". Keep every key and every placeholder.
# The new language is picked up automatically (requests with "Accept-Language: xx"; "xx-YY" is served by
# the file for "xx"). Norwegian: name the file messages_no.properties – it then serves nb, nn and no.
# src/test/.../i18n/MessageBundlesTest checks every file against this one (keys, placeholders, apostrophes).
#
# Rules
#  - {0}, {1} … are filled in by the server. They may be moved within the sentence, but not removed or renumbered.
#  - Write an apostrophe twice: l''adresse, can''t. (The texts are java.text.MessageFormat patterns.)
#    Only exception: the keys starting with "validation." – there an apostrophe is written once and the
#    placeholders have names ({min}, {max}, {value}).
#  - Numbers are inserted as plain counts. Texts with a count are phrased as "label: number" on purpose, so
#    that they are correct for any number in any language. Please keep that form; do not build
#    "{0} files" style sentences that would need singular/plural forms.
#  - Texts ending in ": {0}" are followed by a technical detail (often English, from another program).
#  - Several of these sentences may be shown one after another, separated by a space. Keep the final full stop.

# --- General ------------------------------------------------------------------------------------------------
# {0} = technical detail
error.unexpected=Unexpected error: {0}
error.validation.invalid=Invalid input.
error.upload.tooLarge=The file is too large (maximum 50 MB per PDF).
# secret.key is a file name
error.secret.decryptFailed=A stored password cannot be decrypted (was secret.key changed?)
error.secret.encryptFailed=Encryption failed

# --- Input validation; shown as "field name: text" -----------------------------------------------------------
validation.notBlank=must not be blank
validation.notNull=must not be null
validation.size=size must be between {min} and {max}
validation.min=must be greater than or equal to {value}
validation.max=must be less than or equal to {value}
validation.username=3–50 characters; letters, digits, dot, hyphen, underscore and @ are allowed
validation.password=at least 8 characters
validation.interval.min=at least 1 minute
validation.interval.max=at most 1440 minutes (24 hours)
validation.baseUrl=must start with http:// or https://

