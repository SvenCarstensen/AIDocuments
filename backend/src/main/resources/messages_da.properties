backup.readme=AIDocuments – sikkerhedskopi fra {0,date,long}, {0,time,short}\n\nIndhold: databasen (aidocuments.db), dokumenterne inklusive tidligere versioner (files/), miniaturebillederne (thumbnails/) og nøglen til gemte adgangskoder og totrinsbekræftelsen (secret.key). Opbevar denne fil lige så sikkert som selve dokumenterne.\n\nGendannelse:\n1. Stop AIDocuments.\n2. Pak indholdet af denne ZIP-fil ud i en tom datamappe (eller erstat den hidtidige med det).\n3. Start AIDocuments. Søgeindekset bliver genopbygget ved start.\n
