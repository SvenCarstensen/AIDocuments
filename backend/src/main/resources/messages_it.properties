backup.readme=AIDocuments – backup del {0,date,long}, {0,time,short}\n\nContenuto: il database (aidocuments.db), i documenti incluse le versioni precedenti (files/), le anteprime (thumbnails/) e la chiave per le password salvate e per l’autenticazione a due fattori (secret.key). Conserva questo file con la stessa cura dei documenti.\n\nRipristino:\n1. Arresta AIDocuments.\n2. Estrai il contenuto di questo ZIP in una cartella dati vuota (oppure sostituisci con esso quella esistente).\n3. Avvia AIDocuments. All’avvio l’indice di ricerca viene ricostruito.\n
