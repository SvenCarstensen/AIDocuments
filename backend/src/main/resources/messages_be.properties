error.backup.externalDatabase=Рэзервовае капіраванне адным націсканнем даступнае толькі з убудаванай базай даных. Пры рабоце з MariaDB захоўвайце базу даных яе ўласнымі сродкамі (напрыклад, mariadb-dump), а таксама каталог даных.
backup.readme=AIDocuments – рэзервовая копія ад {0,date,long}, {0,time,short}\n\nЗмесціва: база даных (aidocuments.db), дакументы разам з папярэднімі версіямі (files/), мініяцюры (thumbnails/) і ключ да захаваных пароляў і двухфактарнай аўтэнтыфікацыі (secret.key). Захоўвайце гэты файл гэтак жа надзейна, як самі дакументы.\n\nАднаўленне:\n1. Спыніце AIDocuments.\n2. Распакуйце змесціва гэтага ZIP-архіва ў пусты каталог даных (або замяніце ім наяўны).\n3. Запусціце AIDocuments. Пры гэтым пошукавы індэкс будзе пабудаваны нанова.\n
error.import.notAnExport=Гэта не экспарт AIDocuments (няма файла documents.json).
error.import.tooMany=Максімальная колькасць дакументаў у адным імпарце: {0,number,integer}. Экспартуйце дакументы ў некалькі прыёмаў.
import.fileMissing=Файла няма ў архіве.
import.fileUnreadable=Файл у архіве пашкоджаны.

# --- Passkeys ------------------------------------------------------------------------------------------------
error.passkey.invalid=Ключ доступу не прыняты. Паспрабуйце яшчэ раз.
error.passkey.unknown=AIDocuments не ведае гэтага ключа доступу (або ён больш не дзейнічае). Увайдзіце з паролем.
error.passkey.expired=Тэрмін дзеяння запыту скончыўся. Паспрабуйце яшчэ раз.
error.passkey.exists=Гэты ключ доступу ўжо дададзены.
error.passkey.tooMany=Максімальная колькасць ключоў доступу для аднаго ўліковага запісу: {0,number,integer}. Спачатку выдаліце ключ, які больш не патрэбны.
error.passkey.notFound=Такога ключа доступу няма.
error.passkey.otherAccount=Гэты ключ доступу належыць іншаму ўліковаму запісу.

# --- Automatic backup ----------------------------------------------------------------------------------------
error.backup.directoryInData=Гэтая папка знаходзіцца ўнутры даных, для якіх ствараецца рэзервовая копія. Выберыце асобную папку – лепш за ўсё на іншым дыску.
error.backup.directoryNotWritable=Праграма не можа запісваць у папку «{0}» (або стварыць яе).
error.backup.noSpace=У папцы «{0}» недастаткова вольнага месца – не хапае прыкладна {1,number,integer} МБ.
error.backup.writeFailed=Не ўдалося запісаць рэзервовую копію: {0}
mail.notify.backup.subject=AIDocuments: не ўдалося выканаць аўтаматычнае рэзервовае капіраванне
mail.notify.backup.text=Добры дзень, {0}! Не ўдалося выканаць аўтаматычнае рэзервовае капіраванне AIDocuments. Спроба паўтараецца штогадзіны; гэты ліст прыйдзе зноў, толькі калі рэзервовая копія будзе паспяхова створана, а адна з наступных зноў завершыцца памылкай.
mail.notify.backup.hint=Налады і апошнія рэзервовыя копіі: {0}
