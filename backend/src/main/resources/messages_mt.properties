backup.readme=AIDocuments – backup ta’ {0,date,long}, {0,time,short}\n\nKontenut: id-database (aidocuments.db), id-dokumenti flimkien mal-verżjonijiet preċedenti (files/), l-istampi tad-dehra minn qabel (thumbnails/) u ċ-ċavetta għall-passwords maħżuna u għall-awtentikazzjoni b’żewġ fatturi (secret.key). Żomm dan il-fajl sigur daqs id-dokumenti nfushom.\n\nBiex tirrestawra:\n1. Waqqaf AIDocuments.\n2. Estratta l-kontenut ta’ dan iż-ZIP f’direttorju tad-data vojt (jew ibdel dak eżistenti bih).\n3. Ibda AIDocuments. L-indiċi tat-tfittxija jinbena mill-ġdid malli jibda.\n
