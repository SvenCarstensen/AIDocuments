validation.max=doit être inférieur ou égal à {value}
validation.username=3 à 50 caractères ; les lettres, chiffres, point, tiret, tiret bas et @ sont autorisés
validation.password=au moins 8 caractères
validation.interval.min=au moins 1 minute
validation.interval.max=au plus 1440 minutes (24 heures)
validation.baseUrl=doit commencer par http:// ou https://

