# --- Backup and import ---------------------------------------------------------------------------------------
error.backup.running=Δημιουργείται ήδη ένα αντίγραφο ασφαλείας. Περιμένετε μέχρι να ολοκληρωθεί.
error.backup.externalDatabase=Το αντίγραφο ασφαλείας με ένα κλικ είναι διαθέσιμο μόνο με την ενσωματωμένη βάση δεδομένων. Με MariaDB, δημιουργήστε αντίγραφο της βάσης δεδομένων με τα δικά της εργαλεία (π.χ. mariadb-dump) και επιπλέον του φακέλου δεδομένων.
backup.readme=AIDocuments – αντίγραφο ασφαλείας της {0,date,long}, {0,time,short}\n\nΠεριεχόμενο: η βάση δεδομένων (aidocuments.db), τα έγγραφα μαζί με τις προηγούμενες εκδόσεις (files/), οι εικόνες προεπισκόπησης (thumbnails/) και το κλειδί για τους αποθηκευμένους κωδικούς πρόσβασης και τον έλεγχο ταυτότητας δύο παραγόντων (secret.key). Φυλάξτε αυτό το αρχείο με την ίδια προσοχή όπως τα ίδια τα έγγραφα.\n\nΕπαναφορά:\n1. Τερματίστε το AIDocuments.\n2. Αποσυμπιέστε το περιεχόμενο αυτού του ZIP σε έναν κενό φάκελο δεδομένων (ή αντικαταστήστε με αυτό τον υπάρχοντα φάκελο).\n3. Εκκινήστε το AIDocuments. Το ευρετήριο αναζήτησης δημιουργείται ξανά κατά την εκκίνηση.\n
error.import.notAnExport=Αυτό δεν είναι εξαγωγή του AIDocuments (λείπει το αρχείο documents.json).
error.import.tooMany=Μια εισαγωγή μπορεί να περιέχει το πολύ {0,number,integer} έγγραφα. Κάντε την εξαγωγή σε περισσότερα μέρη.
import.fileMissing=Το αρχείο λείπει από το ZIP.
import.fileUnreadable=Το αρχείο μέσα στο ZIP είναι κατεστραμμένο.

