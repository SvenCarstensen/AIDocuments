# Vorlage: nach debug.yml kopieren und anpassen. debug.yml wird beim lokalen Start automatisch geladen.
app:
  ai:
    # anthropic | openai | moonshot | lm-studio | openai-compatible
    provider: openai-compatible
    base-url: http://<llm-server>:8000/v1
    api-key: <api-schlüssel, falls der Server einen verlangt>
    model: <modell-id>
