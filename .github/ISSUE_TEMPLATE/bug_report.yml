name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security problems do not belong here** – please report them
        privately as described in [SECURITY.md](https://github.com/SvenCarstensen/AIDocuments/blob/main/SECURITY.md).

        Please never attach real documents, screenshots with personal data, passwords or API keys.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Docker image tag or Git commit.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Docker, built-in database (SQLite)
        - Docker, external MariaDB
        - JAR without Docker
        - Development setup
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI provider
      description: Only if the problem has to do with AI analysis, AI search or questions about documents.
      options:
        - Not relevant
        - None set up (built-in text recognition only)
        - Anthropic
        - OpenAI
        - Moonshot
        - LM Studio
        - Other OpenAI-compatible server
  - type: input
    id: browser
    attributes:
      label: Browser and interface language
      placeholder: e.g. Firefox 140, German
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The relevant lines from the server log (`docker logs <container>`). Remove anything private first.
      render: text
