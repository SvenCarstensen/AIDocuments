# Produktion, Variante A: alles in einem Container – die MongoDB läuft im Container mit.
#
#   docker compose up -d --build
#
# Danach http://<server>:8080 öffnen und das Administratorkonto anlegen.
services:
  aidocuments:
    build: .
    image: aidocuments:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      # Optional – lässt sich alles auch in der Oberfläche unter Einstellungen → KI eintragen:
      # AIDOCS_AI_PROVIDER: openai-compatible   # anthropic | openai | moonshot | lm-studio | openai-compatible
      # AIDOCS_AI_BASE_URL: http://192.168.1.10:8000/v1
      # AIDOCS_AI_API_KEY: ...
      # AIDOCS_AI_MODEL: modell-id
      # Eingebaute Texterkennung (Tesseract) für Scans – an, solange keine externe KI eingerichtet ist:
      # AIDOCS_OCR: "off"                     # abschalten
      # AIDOCS_OCR_LANGUAGES: deu+eng+fra     # Sprachen der Dokumente (im Image: deu eng fra ita spa nld)
    volumes:
      # PDFs, Suchindex, Schlüsseldatei und die eingebaute MongoDB (Unterordner mongo/)
      - aidocuments-data:/aidocuments
      # Überwachter Eingangsordner, z. B. das Ziel des Netzwerkscanners:
      # - /pfad/zum/scan-ordner:/import

volumes:
  aidocuments-data:
