# Produktion, Variante B: die Anwendung nutzt eine externe MariaDB.
#
#   docker compose -f docker-compose.mariadb.yml up -d --build
#
# Hier läuft die MariaDB als eigener Dienst daneben. Für eine bereits vorhandene MariaDB den Dienst "mariadb" und
# "depends_on" streichen und AIDOCS_DB_URL, AIDOCS_DB_USER und AIDOCS_DB_PASSWORD auf sie zeigen lassen. Die
# Datenbank muss es geben; die Tabellen legt die Anwendung beim ersten Start selbst an.
# Das Datenbank-Passwort kommt aus MARIADB_PASSWORD (Umgebung oder .env-Datei neben dieser Datei) – ohne startet nichts.
services:
  aidocuments:
    # Das fertige Image (amd64 und arm64); mit --build wird es stattdessen aus diesem Ordner gebaut.
    image: ghcr.io/svencarstensen/aidocuments:latest
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # Unverschlüsselt (HTTP) – so nur im eigenen Netz. Aus dem Internet erreichbar nur über einen Reverse-Proxy
      # mit HTTPS (siehe README); dann "127.0.0.1:8080:8080", damit Port 8080 selbst nicht offen ist –
      # unter Linux umgehen von Docker veröffentlichte Ports die Firewall (ufw), ein „deny 8080“ hilft dort nicht.
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      AIDOCS_DB_URL: jdbc:mariadb://mariadb:3306/aidocuments
      AIDOCS_DB_USER: aidocuments
      AIDOCS_DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD setzen, z. B. in einer .env-Datei neben dieser Datei}
    volumes:
      # weiterhin nötig: PDFs, Suchindex und Schlüsseldatei liegen im Dateisystem
      - aidocuments-data:/aidocuments
      # - /pfad/zum/scan-ordner:/import

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: aidocuments
      MARIADB_USER: aidocuments
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD setzen, z. B. in einer .env-Datei neben dieser Datei}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  aidocuments-data:
  mariadb-data:
