# Produktion, Variante B: die Anwendung nutzt eine externe MongoDB.
#
#   docker compose -f docker-compose.external-mongo.yml up -d --build
#
# Hier läuft die MongoDB als eigener Dienst daneben. Für eine bereits vorhandene MongoDB den Dienst
# "mongo" und "depends_on" streichen und MONGODB_URI auf sie zeigen lassen, z. B.
#   mongodb://benutzer:passwort@db.example.com:27017/aidocuments?authSource=admin
services:
  aidocuments:
    build: .
    image: aidocuments:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      MONGODB_URI: mongodb://mongo:27017/aidocuments
    volumes:
      # weiterhin nötig: PDFs, Suchindex und Schlüsseldatei liegen im Dateisystem
      - aidocuments-data:/aidocuments
      # - /pfad/zum/scan-ordner:/import

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  aidocuments-data:
  mongo-data:
